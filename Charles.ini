working.directory=.
modulepath.1=lib
main.class=com.charlesproxy/com.charlesproxy.main.MainWithClassLoader
vm.version.min=25
vm.location=jdk\bin\server\jvm.dll
vmarg.1=-Dsun.java2d.d3d=false
vmarg.2=-Djava.net.preferIPv4Stack=false
vmarg.3=-Djava.net.preferIPv6Addresses=true
vmarg.4=-Djava.library.path=.\lib
vmarg.5=--add-opens=java.base/sun.security.ssl=com.charlesproxy
vmarg.6=--add-opens=java.desktop/java.awt.event=com.charlesproxy
vmarg.7=--add-opens=java.base/java.io=com.charlesproxy
vmarg.8=--add-opens=java.desktop/java.awt.event=com.charlesproxy
vmarg.9=-XX:+UseZGC
vmarg.10=--add-modules=com.jthemedetector,com.formdev.flatlaf
vmarg.11=--enable-native-access=com.charlesproxy,com.formdev.flatlaf,com.sun.jna
# Load jnidispatch.dll from the copy we ship in .\lib (boot.library.path) and refuse to
# fall back to extracting an unsigned copy of the DLL to %TEMP% at runtime (nounpack).
vmarg.12=-Djna.boot.library.path=.\lib
vmarg.13=-Djna.nounpack=true
vmarg.14=-Duser.language=zh
vmarg.15=-Duser.country=CN
dde.enabled=true
dde.class=com.charlesproxy.windows.WindowsDDEManager
dde.server.name=Charles
dde.topic=System
single.instance=dde
log.level=warning

[ErrorMessages]
java.not.found=The bundled Java installation was not found. Please uninstall and reinstall Charles.
java.failed=The bundled Java installation is broken. Please uninstall and reinstall Charles.
